name: SeleneChat
version: ${version}
description: Chat plugin inspired by LunaChat
main: io.github.bluesheep2804.selenechat.SeleneChatSpigot
author: BlueSheep2804
api-version: 1.13

commands:
  selenechat:
    description: SeleneChat command
    aliases:
      - sc
    permission: selenechat.command.selenechat
  message:
    description: Selenechat message command
    aliases:
      - msg
      - tell
      - w
    permission: selenechat.command.message
  japanize:
    description: SeleneChat japanize command
    aliases:
      - jp
    permission: selenechat.command.japanize
  channel:
    description: SeleneChat channel command
    aliases:
      - ch
    permission: selenechat.command.channel

permissions:
  selenechat.colorcode:
    description: Allow color codes to be used in chat
    default: true
  selenechat.command.selenechat:
    description: Allow the use of SeleneChat commands
    default: op
  selenechat.command.selenechat.reload:
    description: Allow use of SeleneChat reload command
    default: op
  selenechat.command.message:
    description: Allow use of SeleneChat message command
    default: true
  selenechat.command.japanize:
    description: Allow use of SeleneChat japanize command
    default: true
  selenechat.channel:
    description: Allow use of SeleneChat channel command
    default: true
  selenechat.channel.create:
    description: Allow use of channel create command
    default: true
  selenechat.channel.delete:
    description: Allow use of channel delete command
    default: true
  selenechat.channel.list:
    description: Allow use of channel list command
    default: true
  selenechat.channel.join:
    description: Allow use of channel join command
    default: true
  selenechat.channel.leave:
    description: Allow use of channel leave command
    default: true

  selenechat.channel.format:
    description: Allow use of channel format command
    default: true
  selenechat.channel.jp:
    description: Allow use of channel jp command
    default: true
  selenechat.channel.moderator:
    description: Allow use of channel moderator command
    default: true
  selenechat.channel.visible:
    description: Allow use of channel visible command
    default: true
